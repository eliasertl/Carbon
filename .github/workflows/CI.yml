name: CI

# Paused to save Actions minutes: the workflow runs only when it is started by hand (Actions > CI > Run workflow).
# To turn it back on, restore the push and pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

# A newer commit of a pull request replaces the run of the older one. Pushes to main are never cancelled: a run
# that is building Dawn should get to store it in the cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Dawn commit Carbon is developed and tested against. Keep in sync with README.md and Docs/Building.md.
  DAWN_COMMIT: 91158020c0b1cb0ddb4dc1c2c29e5a4669374f0b
  # Bump to rebuild Dawn with the same commit, for example after changing its build options below.
  DAWN_CACHE_VERSION: 1
  CLANG_FORMAT_VERSION: 20.1.8
  # The Emscripten SDK the web build uses.
  EMSDK_VERSION: 6.0.11
  # The Vulkan SDK the Windows job builds the Vulkan backend with (headers, import library, glslc, loader).
  VULKAN_SDK_VERSION: 1.4.335.0

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: pipx install clang-format==${{ env.CLANG_FORMAT_VERSION }}
      - name: Check formatting
        run: Scripts/Format.sh --check

  # Dawn takes most of an hour to build, so it is built once per platform and commit and then cached. The build
  # jobs below only restore the cache.
  dawn:
    name: Dawn (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          # Dawn at this commit does not compile with GCC 13, so it is built with Clang. The static library
          # serves both Linux jobs below: GCC and Clang share libstdc++. Its C++ module target is switched off
          # because CMake cannot scan modules with the compilers on the runner.
          - name: Linux
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            options: -DDAWN_SUPPORTS_CXX_MODULES=OFF
    steps:
      - name: Look for a cached Dawn
        id: cache
        uses: actions/cache@v6
        with:
          path: dawn-install
          key: dawn-${{ runner.os }}-${{ env.DAWN_COMMIT }}-v${{ env.DAWN_CACHE_VERSION }}

      - name: Install build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3 \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev mesa-common-dev
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Set up MSVC (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          # The environment of a VS developer prompt, for the steps that follow: cl, link and the SDK on PATH.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Install Ninja (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: bash
        run: command -v ninja || choco install ninja --no-progress -y

      - name: Fetch Dawn
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init dawn-source
          cd dawn-source
          git remote add origin https://dawn.googlesource.com/dawn
          git fetch --depth 1 origin "$DAWN_COMMIT"
          git checkout FETCH_HEAD

      - name: Build and install Dawn
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S dawn-source -B dawn-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_FETCH_DEPENDENCIES=ON \
            -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_BUILD_SAMPLES=OFF \
            -DDAWN_BUILD_TESTS=OFF \
            -DDAWN_USE_GLFW=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DDAWN_ENABLE_OPENGLES=OFF \
            -DTINT_BUILD_TESTS=OFF \
            -DTINT_BUILD_CMD_TOOLS=OFF \
            ${{ matrix.options }}
          cmake --build dawn-build
          cmake --install dawn-build --prefix dawn-install

  # A web build: Carbon compiled with Emscripten, the OpenGL ES backend for WebGL 2, the tests in Node and the
  # example pages (OpenGLES/Minimal, Gallery, CustomComponent and Reflection) as an artifact. It needs
  # no Dawn.
  emscripten:
    name: Emscripten (WebGL 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The SDK is cached by its version, together with what Emscripten builds into its own cache on first use
      # (the system libraries, the GLFW port). The cache is stored after the build, so it holds those too.
      - name: Look for a cached Emscripten SDK
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          ~/emsdk/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Install Ninja
        run: command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Configure
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B Build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCARBON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build Build

      - name: Test
        run: |
          source ~/emsdk/emsdk_env.sh
          ctest --test-dir Build --output-on-failure --parallel 4

      - name: Upload the web examples
        uses: actions/upload-artifact@v7
        with:
          name: Web examples
          path: |
            Build/Examples/**/*.html
            Build/Examples/**/*.js
            Build/Examples/**/*.wasm

  build:
    name: ${{ matrix.name }}
    needs: dawn
    # The Windows job commits updated documentation screenshots to main; see the last step.
    permissions:
      contents: write
    # Also when Dawn failed to build for another platform: the cache restore below decides for this one.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC (Release)
            os: windows-2022
            build_type: Release
          - name: Linux GCC (Debug)
            os: ubuntu-24.04
            build_type: Debug
            cc: gcc-13
            cxx: g++-13
          # The installed package is checked in one job: it builds the same sources in all of them.
          - name: Linux Clang (Release)
            os: ubuntu-24.04
            build_type: Release
            cc: clang-18
            cxx: clang++-18
            package: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Dawn
        uses: actions/cache/restore@v6
        with:
          path: dawn-install
          key: dawn-${{ runner.os }}-${{ env.DAWN_COMMIT }}-v${{ env.DAWN_CACHE_VERSION }}
          fail-on-cache-miss: true

      # The window-system packages are what GLFW needs for the examples. The Mesa Vulkan drivers provide a
      # software adapter (lavapipe), so that the renderer tests and the screenshots below run without a GPU, for
      # Dawn and for Carbon's Vulkan backend. glslc compiles the Vulkan backend's shaders; the validation layers
      # check its calls in the tests. Xvfb gives the OpenGL backend's tests and example a display, and Mesa's
      # llvmpipe an OpenGL 3.3 context on it.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache \
            libx11-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            mesa-vulkan-drivers libvulkan1 libvulkan-dev glslc vulkan-validationlayers \
            xvfb libgl1-mesa-dri
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          echo "CARBON_COMPILER_CACHE=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      # Most of a build is third-party code and sources that did not change since the last run: ccache returns
      # their object files. Every run stores its cache under a new key and starts from the latest one.
      - name: Restore the compiler cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.cxx }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cxx }}-${{ matrix.build_type }}-

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The environment of a VS developer prompt, for the steps that follow: cl, link and the SDK on PATH.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v ninja || choco install ninja --no-progress -y

      # Of the Vulkan SDK the build needs the headers, the loader's import library and glslc, and the tests need
      # the loader itself (vulkan-1.dll) to start; the runtime installer brings that. Those few files are cached
      # by the SDK's version, with the loader next to glslc, where the PATH finds it. The runner has no Vulkan
      # driver, so the Vulkan tests skip there.
      - name: Look for a cached Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        id: vulkan
        uses: actions/cache@v6
        with:
          path: |
            C:\VulkanSDK\Include
            C:\VulkanSDK\Lib\vulkan-1.lib
            C:\VulkanSDK\Bin\glslc.exe
            C:\VulkanSDK\Bin\vulkan-1.dll
          key: vulkan-sdk-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}-v1

      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows"
          Invoke-WebRequest "$base/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          Invoke-WebRequest "$base/vulkan-runtime.exe" -OutFile vulkan-runtime.exe
          Start-Process -Wait -FilePath .\vulkan-runtime.exe -ArgumentList '/S'
          Copy-Item "$env:SystemRoot\System32\vulkan-1.dll" C:\VulkanSDK\Bin\vulkan-1.dll

      - name: Use the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      # CMake wants forward slashes, also on Windows: there, `pwd -W` prints the path that way.
      - name: Configure
        shell: bash
        run: |
          workspace="$(pwd -W 2>/dev/null || pwd)"
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            "-DCMAKE_PREFIX_PATH=$workspace/dawn-install" \
            -DCARBON_WARNINGS_AS_ERRORS=ON $CARBON_COMPILER_CACHE \
            -DCARBON_BACKEND_WEBGPU=ON -DCARBON_BACKEND_VULKAN=ON -DCARBON_BACKEND_OPENGL=ON -DCARBON_BACKEND_OPENGLES=ON             -DCARBON_BACKEND_DX11=$([ "$RUNNER_OS" = "Windows" ] && echo ON || echo OFF) \
            -DCARBON_BACKEND_DX9=$([ "$RUNNER_OS" = "Windows" ] && echo ON || echo OFF)

      - name: Build
        shell: bash
        run: |
          cmake --build Build
          if [ "$RUNNER_OS" = "Linux" ]; then ccache --show-stats; fi

      # In parallel: the tests without a GPU are independent, and the renderer backends' tests, one entry per
      # backend, take turns. On Linux under a virtual display, for OpenGL. Where the runner cannot create an
      # OpenGL 3.3 or Vulkan device (Windows), those entries are skipped.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir Build --output-on-failure --parallel 4
          else
            ctest --test-dir Build --output-on-failure --parallel 4
          fi

      # A smoke test of the examples, and something to look at: the screenshots are uploaded as an artifact.
      # It needs a WebGPU adapter (WARP on Windows, lavapipe on Linux), so a failure here is reported but does
      # not fail the job.
      - name: Render screenshots
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p Screenshots
          Build/Examples/WebGPU/Gallery --screenshot Screenshots/WebGPUGallery-Light.png --page selection
          Build/Examples/WebGPU/Gallery --screenshot Screenshots/WebGPUGallery-Dark.png --page charts --theme dark
          Build/Examples/WebGPU/Gallery --screenshot Screenshots/WebGPUGallery-Menu.png --page menus --show menu --scale 2
          Build/Examples/WebGPU/Minimal --screenshot Screenshots/WebGPUMinimal.png
          Build/Examples/Vulkan/Minimal --screenshot Screenshots/VulkanMinimal.png || true
          Build/Examples/Vulkan/Gallery --screenshot Screenshots/VulkanGallery.png --page images || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            Build/Examples/DX11/Minimal --screenshot Screenshots/DX11Minimal.png
            Build/Examples/DX11/Gallery --screenshot Screenshots/DX11Gallery.png --page images
            Build/Examples/DX9/Minimal --screenshot Screenshots/DX9Minimal.png || true
            Build/Examples/DX9/Gallery --screenshot Screenshots/DX9Gallery.png --page images || true
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a Build/Examples/OpenGL/Minimal --screenshot Screenshots/OpenGLMinimal.png
            xvfb-run -a Build/Examples/OpenGLES/Minimal --screenshot Screenshots/OpenGLESMinimal.png
            xvfb-run -a Build/Examples/OpenGL/Gallery --screenshot Screenshots/OpenGLGallery.png --page images
            xvfb-run -a Build/Examples/OpenGLES/Gallery --screenshot Screenshots/OpenGLESGallery.png --page images
          fi
          Build/Examples/WebGPU/CustomComponent --screenshot Screenshots/WebGPUCustomComponent.png
          Build/Examples/WebGPU/CustomTitleBar --screenshot Screenshots/WebGPUCustomTitleBar.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots (${{ matrix.name }})
          path: Screenshots
          if-no-files-found: ignore

      # The documentation's screenshots follow the code: after a push to main, the Windows job renders them from
      # Docs/Images/Screenshots.txt and commits the images that look different. WARP renders within a level or two
      # of a GPU, below the script's tolerance, so unchanged images stay as they are. A push made by this token
      # starts no workflow of its own.
      - name: Update documentation screenshots
        if: matrix.os == 'windows-2022' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python Scripts/Screenshots.py --build Build
          git add Docs/Images
          if git diff --cached --quiet; then
            echo "The documentation screenshots are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update documentation screenshots"
            git push origin HEAD:main || echo "::warning::main has moved on; the next run updates the screenshots"
          fi

      # The installed package: find_package(Carbon), a custom component and the extension sources built from
      # the installed headers only.
      - name: Install
        if: matrix.package
        run: cmake --install Build --prefix Install

      - name: Build and test against the installed package
        if: matrix.package
        shell: bash
        run: |
          workspace="$(pwd -W 2>/dev/null || pwd)"
          cmake -S Tests/Package -B Build/Package -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            "-DCMAKE_PREFIX_PATH=$workspace/Install;$workspace/dawn-install"
          cmake --build Build/Package
          ctest --test-dir Build/Package --output-on-failure
