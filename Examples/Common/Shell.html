<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- The page fills the screen, under the status bar and around a notch (viewport-fit=cover; Carbon keeps its
         content inside the safe area), and the browser never zooms it: Carbon zooms what can be zoomed itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Carbon</title>
    <style>
        /* The canvas fills the whole viewport; Carbon draws everything inside it. The example sizes its
           framebuffer to the window (MakeCanvasResizable), so the page itself never scrolls. */
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
                     -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #ffffff; }
        body { position: fixed; inset: 0; }
        @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
        /* Fingers belong to Carbon: no panning, zooming, selecting or callouts by the browser. */
        canvas { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; outline: none;
                 touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
                 -webkit-tap-highlight-color: transparent; }
        #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                  font: 13px system-ui, sans-serif; color: #888; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">Loading…</div>
    <!-- The GLFW port takes this canvas as the window. tabindex lets it receive keyboard focus. -->
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            // Emscripten reports its progress here, also after the page has started; then there is no status any more.
            setStatus: function (text) {
                var status = document.getElementById('status');
                if (status) status.textContent = text;
            },
            onRuntimeInitialized: function () {
                document.getElementById('status').remove();
                document.getElementById('canvas').focus();
            },
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
