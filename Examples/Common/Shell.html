<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carbon</title>
    <style>
        /* The canvas fills the whole viewport; Carbon draws everything inside it. The example sizes its
           framebuffer to the window (MakeCanvasResizable), so the page itself never scrolls. */
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
        #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                  font: 13px system-ui, sans-serif; color: #888; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">Loading…</div>
    <!-- The GLFW port takes this canvas as the window. tabindex lets it receive keyboard focus. -->
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            // Emscripten reports its progress here, also after the page has started; then there is no status any more.
            setStatus: function (text) {
                var status = document.getElementById('status');
                if (status) status.textContent = text;
            },
            onRuntimeInitialized: function () {
                document.getElementById('status').remove();
                document.getElementById('canvas').focus();
            },
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
